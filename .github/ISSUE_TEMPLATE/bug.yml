name: Bug report
description: Report reproducible incorrect behavior and expected outcome.
title: "[Bug]: "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened, including exact errors and impact?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps, inputs, and environment.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Sanitized logs, screenshots, failing tests, commit, version, or related issue.
  - type: textarea
    id: scope
    attributes:
      label: Suspected scope and risk
      description: Affected users, data, security, compatibility, or operational consequences.
