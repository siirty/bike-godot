# Fill this file immediately after creating a project from the template.
project:
  name: "bike-godot"
  description: "Godot bike trainer app over a Rust core: standalone domain crates plus trainer_core"
  default_branch: "main"
  status: "active"

commands:
  setup: "cargo fetch"
  format: "cargo fmt --all --check"
  lint: "cargo clippy --workspace --all-targets -- -D warnings"
  typecheck: "cargo check --workspace"
  test: "cargo test --workspace"
  build: "cargo build -p godot_adapter"
  ci: "./scripts/ci.sh"

architecture:
  summary: "Godot app (GDScript presentation) + godot_adapter GDExtension over Rust domain crates (workout_import, race_physics, session_director, race_engine, trainer_control, local_storage) and ble_trainer over trainer_core (git dep). In-process; no Dart."
  primary_languages: ["gdscript", "rust"]
  frameworks: ["godot-4.3"]
  data_stores: ["sqlite (local workout library, rusqlite)"]
  external_services: []

quality:
  required_test_types: []
  coverage_policy: "No numeric threshold until the project defines one. Changed behavior still requires meaningful tests."
  compatibility_policy: "Preserve compatibility unless an approved requirement states otherwise."

security:
  data_classification: "unspecified"
  sensitive_areas: []
  forbidden_agent_actions:
    - "Access or expose secrets"
    - "Deploy to production without explicit human authorization"
    - "Change access control or billing without explicit human authorization"

ownership:
  owner: "Levin Schmidt (siirty)"
  reviewers: []
