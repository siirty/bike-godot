# Fill this file immediately after creating a project from the template.
project:
  name: "bike-godot"
  description: "Godot trainer app shell over trainer_core (Rust) and the headless Dart domain core"
  default_branch: "main"
  status: "active"

commands:
  setup: "dart pub get (domain core, in bike-training-app) / cargo fetch"
  format: "cargo fmt --all --check"
  lint: "cargo clippy --workspace -- -D warnings"
  typecheck: "cargo check --workspace"
  test: "cargo test --workspace"
  build: ""
  ci: "./scripts/ci.sh"

architecture:
  summary: "Godot shell + Rust trainer adapter (trainer_core git dep) + headless Dart domain core (separate repo/process)."
  primary_languages: ["gdscript", "rust"]
  frameworks: ["godot-4.3"]
  data_stores: []
  external_services: []

quality:
  required_test_types: []
  coverage_policy: "No numeric threshold until the project defines one. Changed behavior still requires meaningful tests."
  compatibility_policy: "Preserve compatibility unless an approved requirement states otherwise."

security:
  data_classification: "unspecified"
  sensitive_areas: []
  forbidden_agent_actions:
    - "Access or expose secrets"
    - "Deploy to production without explicit human authorization"
    - "Change access control or billing without explicit human authorization"

ownership:
  owner: "Levin Schmidt (siirty)"
  reviewers: []
