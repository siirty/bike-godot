# Cargo workspace for the bike trainer app: the Rust domain core plus the Godot adapter.
#
# Domain contracts and development are owned by this repository. Frozen regression vectors
# under fixtures/golden require no external checkout or generator.
#
# The trainer core lives in its own repository (siirty/bike-training-core) and is consumed as an
# ordinary git dependency, pinned by commit rev. The Godot shell talks to everything through one
# GDExtension built from crates/godot_adapter.
[workspace]
resolver = "2"
members = [
  "crates/ble_trainer",
  "crates/local_storage",
  "crates/race_engine",
  "crates/race_physics",
  "crates/session_director",
  "crates/trainer_control",
  "crates/workout_import",
  "crates/godot_adapter",
  "tools/ftms-spike",
]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
log = "0.4"
tokio = "1.53.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
godot = { version = "0.5.5", features = ["api-4-3"] }
async-trait = "0.1"
# The trainer connection core stays its own repository. In the app, only crates/ble_trainer may
# depend on it: that crate's public surface is the reviewed SIM-only subset (no ERG path reaches
# the app). The other user is tools/ftms-spike, a SIM-only hardware experiment runner outside the app.
trainer_core = { git = "https://github.com/siirty/bike-training-core", rev = "49bde0bd25bed2ce01eb1b1ceb9bb857e5240089" }

workout_import = { path = "crates/workout_import" }
race_physics = { path = "crates/race_physics" }
trainer_control = { path = "crates/trainer_control" }
session_director = { path = "crates/session_director" }
race_engine = { path = "crates/race_engine" }
local_storage = { path = "crates/local_storage" }
ble_trainer = { path = "crates/ble_trainer" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
float_cmp = "allow"
